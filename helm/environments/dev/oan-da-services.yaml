# Values for the oan-da-services chart (helm/oan-da-services).
# Target: the oan_dev k3s node, installed by the Jenkins stage "develop → oan_dev (helm)"
# (ci/deploy-helm-dev.sh). Release `da-services`, namespace `da-app`.
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `<__version__>-develop.<build>`

global:
  baseDomain: development.oanstaging.com

frappe:
  image:
    # Jenkinsfile ECR_REPO, pushed by "Push image" on develop. The node pulls from ECR with its IAM role
    # (kubelet ecr-credential-provider).
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/oan-da-services/da-services

  # The shared PostgreSQL of the oan-frappe-common release (namespace frappe-common).
  dbHost: oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local
  dbRootUser: postgres

  nginx:
    environment:
      # The desk host (oan-da-services-gateway.yaml desk.host) is not the site name, so nginx names the site itself.
      frappeSiteNameHeader: da-services.development.oanstaging.com
      # APISIX reaches nginx from the k3s pod network: trust its X-Forwarded-For for the client address.
      upstreamRealIPAddress: 10.42.0.0/16
  persistence:
    worker:
      # ReadWriteMany from the NFS server.
      storageClass: nfs-csi

  siteConfig:
    values:
      host_name: https://da-services.development.oanstaging.com

  jobs:
    configure:
      # nfs-csi creates each volume directory with mode 0777, so the Frappe user can write it.
      fixVolume: false
    createSite:
      siteName: da-services.development.oanstaging.com
