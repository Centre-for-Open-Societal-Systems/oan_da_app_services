  - name: oan-da-services-auth-credentials-public-post
    description: Credential-sensitive endpoints (login, register, reset). Per-IP limit against stuffing,
      loose enough for users sharing one address behind NAT; per-account limits are enforced by the app.
      Rejects requests when the limiter store is down.
    labels:
      app: oan-da-services
      tier: auth-credentials
      auth: public
    uris:
    - /v1/auth/forgot-password
    - /v1/auth/iam/login
    - /v1/auth/login
    - /v1/auth/password/forgot
    - /v1/auth/password/initial
    - /v1/auth/password/reset
    - /v1/auth/register
